name: dulms-monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      text:
        description: "Telegram command (filled in by the relay; leave empty when running by hand)"
        required: false
        default: ""

permissions:
  contents: write

# scheduled/manual checks run one at a time; every Telegram command gets its own lane
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.text != '') && format('cmd-{0}', github.run_id) || 'dulms-monitor' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check DULMS
        run: python monitor.py
        env:
          DULMS_USER: ${{ secrets.DULMS_USER }}
          DULMS_PASS: ${{ secrets.DULMS_PASS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TEXT: ${{ inputs.text }}

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || (git commit -m "update state" && git push)
